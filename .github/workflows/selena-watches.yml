# Selena's scheduler.
#
# GitHub Actions rather than Vercel Cron, for two reasons: a deep dig is many
# round trips and does not fit inside a 60s function, and Vercel's Hobby cron
# fires roughly once a day. The sweep calls /api/cron repeatedly, a couple of
# watches at a time, so every individual request stays comfortably inside the
# function limit and one slow watch cannot take the rest of the sweep down.
#
# Set two repository secrets before this does anything:
#   SELENA_URL    https://your-selena-deployment.vercel.app
#   SELENA_TOKEN  the same value as the SELENA_TOKEN env var on Vercel
#
# With SELENA_URL unset the job exits 0 and says so, rather than failing every
# morning and training you to ignore the red cross.
#
# All the logic is in selena/scripts/sweep.mjs and none of it is in this file.
# The first version embedded a multi-line Python block in a `run:` scalar; its
# lines sat at column zero, which silently made this whole file invalid YAML —
# GitHub would have rejected the workflow and the watches would never have run.
# A script in the repo can be executed against a live server before it is
# trusted. This one was.

name: Selena watches

on:
  schedule:
    # 06:10 and 18:10 UTC. Not on the hour: everything in the world runs on the
    # hour and a queued Action can be delayed by many minutes.
    - cron: '10 6 * * *'
    - cron: '10 18 * * *'
  workflow_dispatch:
    inputs:
      passes:
        description: 'How many times to call /api/cron'
        required: false
        default: '4'

concurrency:
  # Two sweeps at once would double-spend and race each other's watch memory.
  group: selena-watches
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sweep
        working-directory: selena
        env:
          SELENA_URL: ${{ secrets.SELENA_URL }}
          SELENA_TOKEN: ${{ secrets.SELENA_TOKEN }}
          PASSES: ${{ github.event.inputs.passes || '4' }}
        run: node scripts/sweep.mjs
