<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090c" />
    <meta name="description" content="Grace — a personal assistant with a memory." />
    <title>Grace</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      The theme goes on before anything is drawn.

      React cannot do this: by the time it mounts, a frame has already been
      painted, and in daylight that frame is black. A flash of the wrong theme
      on every single load is the sort of thing that is impossible to unsee
      once noticed, and this is four lines.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('grace-theme');
          document.documentElement.dataset.theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.style.colorScheme =
            document.documentElement.dataset.theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
