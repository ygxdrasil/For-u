<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
  body{margin:0;overflow:hidden;background:#000;}
  #canvas{position:relative;width:1920px;height:1080px;overflow:hidden;background:#06080c;}
  #scene{position:absolute;top:0;left:0;}
  .screen{mix-blend-mode:screen;}
  #titlewrap{
    position:absolute;top:64px;left:0;width:1920px;text-align:center;
    transform:rotate(-1.5deg);
  }
  #title{
    font-family:'Black Ops One';font-size:185px;line-height:1;color:#ffffff;
    letter-spacing:6px;
    text-shadow:
      0 0 6px rgba(255,255,255,.95),
      0 0 22px #ff2bd6,
      0 0 55px rgba(255,43,214,.8),
      0 0 120px rgba(255,43,214,.45);
  }
  #subtitle{
    font-family:'Anton';font-size:36px;color:#22e6ff;margin-top:14px;
    letter-spacing:12px;
    text-shadow:0 0 14px rgba(34,230,255,.65), 0 0 34px rgba(34,230,255,.35);
  }
  .hud{font-family:'Orbitron';position:absolute;color:rgba(125,244,255,.45);}
  #hud-wave{top:42px;right:52px;font-size:30px;letter-spacing:6px;text-align:right;}
  #hud-wave small{display:block;font-size:14px;letter-spacing:4px;color:rgba(255,255,255,.30);}
  #hud-ammo{bottom:40px;left:52px;font-size:26px;letter-spacing:4px;color:rgba(255,255,255,.38);}
  #hud-ammo b{font-size:40px;color:rgba(255,255,255,.55);font-weight:400;}
  #vignette{
    position:absolute;top:0;left:0;width:1920px;height:1080px;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.28) 70%, rgba(0,0,0,.60) 100%);
  }
  #grain{position:absolute;top:0;left:0;mix-blend-mode:overlay;opacity:.05;}
</style>
</head>
<body>
<div id="canvas">

<svg id="scene" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <!-- ======== gradients ======== -->
  <linearGradient id="gCeil" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05070b"/><stop offset="1" stop-color="#151b25"/>
  </linearGradient>
  <linearGradient id="gFloor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3240"/><stop offset=".45" stop-color="#161c26"/><stop offset="1" stop-color="#090c11"/>
  </linearGradient>
  <linearGradient id="gLWall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0d1118"/><stop offset="1" stop-color="#212835"/>
  </linearGradient>
  <linearGradient id="gRWall" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0f131a"/><stop offset="1" stop-color="#232b38"/>
  </linearGradient>
  <radialGradient id="gFarWall" cx=".5" cy=".55" r=".9">
    <stop offset="0" stop-color="#232b37"/><stop offset="1" stop-color="#141922"/>
  </radialGradient>
  <radialGradient id="portalHalo" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#22e6ff" stop-opacity=".7"/>
    <stop offset=".55" stop-color="#22e6ff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#22e6ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="portalCore" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22e6ff"/>
    <stop offset=".28" stop-color="#eafdff"/>
    <stop offset=".72" stop-color="#eafdff"/>
    <stop offset="1" stop-color="#22e6ff"/>
  </linearGradient>
  <linearGradient id="portalRefl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22e6ff" stop-opacity=".5"/>
    <stop offset="1" stop-color="#22e6ff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="poolM" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff2bd6" stop-opacity=".5"/>
    <stop offset=".6" stop-color="#ff2bd6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="poolC" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#22e6ff" stop-opacity=".5"/>
    <stop offset=".6" stop-color="#22e6ff" stop-opacity=".15"/>
    <stop offset="1" stop-color="#22e6ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="panelM" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff5ce1"/><stop offset="1" stop-color="#c015a0"/>
  </linearGradient>
  <radialGradient id="coreC" cx=".5" cy=".5" r=".65">
    <stop offset="0" stop-color="#eaffff"/><stop offset=".5" stop-color="#7df4ff"/><stop offset="1" stop-color="#22e6ff"/>
  </radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a3240"/><stop offset="1" stop-color="#1a202a"/>
  </linearGradient>
  <radialGradient id="flashGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".25" stop-color="#ff5ce1" stop-opacity=".55"/>
    <stop offset=".6" stop-color="#ff2bd6" stop-opacity=".18"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="flashWall" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ff5ce1" stop-opacity=".22"/>
    <stop offset=".5" stop-color="#ff2bd6" stop-opacity=".09"/>
    <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="flashLick" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffd7f4" stop-opacity=".8"/>
    <stop offset=".5" stop-color="#ff5ce1" stop-opacity=".25"/>
    <stop offset="1" stop-color="#ff5ce1" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hazeFar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0c1016" stop-opacity="0"/>
    <stop offset=".5" stop-color="#141922" stop-opacity=".45"/>
    <stop offset="1" stop-color="#0c1016" stop-opacity="0"/>
  </linearGradient>

  <!-- ======== filters ======== -->
  <filter id="glowM" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowC" x="-120%" y="-120%" width="340%" height="340%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glowBig" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="wallNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="4" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.55 0 0 0 0 0.62  0 0 0 0.5 0"/>
    <feComposite operator="in" in2="SourceGraphic"/>
  </filter>

  <!-- ======== clips ======== -->
  <clipPath id="clipCeil"><polygon points="0,0 1920,0 1020,350 760,350"/></clipPath>
  <clipPath id="clipFloor"><polygon points="0,1080 1920,1080 1020,570 760,570"/></clipPath>
  <clipPath id="clipLWall"><polygon points="0,0 760,350 760,570 0,1080"/></clipPath>
  <clipPath id="clipRWall"><polygon points="1920,0 1020,350 1020,570 1920,1080"/></clipPath>

    <rect x="-46" y="-12" width="52" height="12" fill="#151a22" stroke="#0b0f15" stroke-width="2"/>
    <!-- pelvis -->
    <rect x="-58" y="-140" width="116" height="38" fill="#1b212b" stroke="#0b0f15" stroke-width="2"/>
    <!-- arms behind torso -->
    <rect x="-114" y="-250" width="34" height="80" fill="#1d232d" stroke="#0b0f15" stroke-width="2"/>
    <rect x="80" y="-250" width="34" height="80" fill="#1d232d" stroke="#0b0f15" stroke-width="2"/>
    <polygon points="-118,-172 -80,-172 -74,-98 -112,-98" fill="#20262f" stroke="#0b0f15" stroke-width="2"/>
    <polygon points="80,-172 118,-172 112,-98 74,-98" fill="#20262f" stroke="#0b0f15" stroke-width="2"/>
    <rect x="-116" y="-98" width="40" height="38" fill="#181e27" stroke="#0b0f15" stroke-width="2"/>
    <rect x="76" y="-98" width="40" height="38" fill="#181e27" stroke="#0b0f15" stroke-width="2"/>
    <!-- torso -->
    <rect x="-78" y="-300" width="156" height="162" fill="url(#metal)" stroke="#0b0f15" stroke-width="3"/>
    <line x1="-78" y1="-196" x2="78" y2="-196" stroke="#0b0f15" stroke-width="2"/>
    <line x1="-34" y1="-300" x2="-34" y2="-140" stroke="#0b0f15" stroke-width="2"/>
    <line x1="34" y1="-300" x2="34" y2="-140" stroke="#0b0f15" stroke-width="2"/>
    <!-- shoulders -->
    <rect x="-124" y="-302" width="52" height="54" fill="#20262f" stroke="#0b0f15" stroke-width="2"/>
    <rect x="72" y="-302" width="52" height="54" fill="#20262f" stroke="#0b0f15" stroke-width="2"/>
    <!-- head -->
    <rect x="28" y="-404" width="8" height="26" fill="#262c37"/>
    <rect x="-48" y="-382" width="96" height="74" fill="#1d2430" stroke="#0b0f15" stroke-width="3"/>
    <rect x="-56" y="-364" width="8" height="30" fill="#151a22" stroke="#0b0f15" stroke-width="1.5"/>
    <rect x="48" y="-364" width="8" height="30" fill="#151a22" stroke="#0b0f15" stroke-width="1.5"/>
    <line x1="-48" y1="-326" x2="48" y2="-326" stroke="#0b0f15" stroke-width="2"/>
    <!-- chest plate recess -->
    <rect x="-30" y="-258" width="60" height="64" fill="#10151d" stroke="#0b0f15" stroke-width="2"/>
    <!-- MAGENTA GLOW PANELS -->
    <g filter="url(#glowM)">
      <polygon points="-38,-362 -8,-354 -8,-338 -38,-348" fill="url(#panelM)"/>
      <polygon points="8,-354 38,-362 38,-348 8,-338" fill="url(#panelM)"/>
      <rect x="-118" y="-296" width="40" height="16" fill="url(#panelM)"/>
      <rect x="78" y="-296" width="40" height="16" fill="url(#panelM)"/>
      <rect x="-70" y="-290" width="32" height="84" fill="url(#panelM)"/>
      <rect x="38" y="-290" width="32" height="84" fill="url(#panelM)"/>
      <rect x="-50" y="-188" width="44" height="40" fill="url(#panelM)"/>
      <rect x="6" y="-188" width="44" height="40" fill="url(#panelM)"/>
      <rect x="-16" y="-136" width="32" height="22" fill="url(#panelM)"/>
      <rect x="-112" y="-92" width="32" height="10" fill="url(#panelM)"/>
      <rect x="80" y="-92" width="32" height="10" fill="url(#panelM)"/>
      <rect x="-40" y="-40" width="24" height="12" fill="url(#panelM)"/>
      <rect x="22" y="-42" width="20" height="12" fill="url(#panelM)"/>
    </g>
    <!-- panel seams over magenta -->
    <line x1="-54" y1="-248" x2="-38" y2="-248" stroke="#12000e" stroke-width="2" opacity=".7"/>
    <line x1="38" y1="-248" x2="70" y2="-248" stroke="#12000e" stroke-width="2" opacity=".7"/>
    <!-- CYAN CORE -->
    <g filter="url(#glowC)">
      <rect x="-18" y="-246" width="36" height="40" fill="url(#coreC)"/>
    </g>
    <rect x="-8" y="-236" width="16" height="20" fill="#ffffff"/>
  </g>
</defs>
